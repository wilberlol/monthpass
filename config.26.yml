# MonthPass 設定檔 — 廢俱26
# 原則：月卡不產生遊戲幣 $（不破壞經濟），獎勵給活躍點、經驗倍率與生存物資。
# 購買：贊助點商店 (/dshop) 付贊助點後由 DeluxeMenus 執行 `mp give`；這裡的 shop 全部關閉。

database:
  file: plugins/MonthPass/data.db

timezone: Asia/Taipei
date-format: "yyyy/MM/dd"

sign-reminder:
  enable: true
  interval: 600   # 秒；今天簽到後自動停止
  message: '&e你有月卡獎勵尚未領取！輸入 &6/mp sign &e簽到'

# 月卡飛行在生存世界會破壞玩法，整個模組關閉
fly:
  enable: false
  enforce-interval-ticks: 40

# 連續簽到：資料存在玩家 PDC。漏簽時自動消耗補簽卡（漏幾天扣幾張，最多 max-makeup-gap 天）接上連簽，
# 補簽不重發每日獎勵。cycle：達到天數後新一輪開始，里程碑可重複領。補簽卡由獎勵指令 `mp makeup {player} <張數>` 發放。
streak:
  enable: true
  max-makeup-gap: 3
  cycle: 60
  milestones:
    7:
      message: '&6連簽 {days} 天！&7獲得 活躍點 10、補簽卡 1、鑽石 8'
      commands:
        - 'points give {player} 10 -s'
        - 'mp makeup {player} 1'
        - 'minecraft:give {player} minecraft:diamond 8'
    14:
      message: '&6連簽 {days} 天！&7獲得 活躍點 20、縮小藥水、巨人藥水、修復次數 ×3、黏液 REINFORCED_PLATE ×4'
      commands:
        - 'points give {player} 20 -s'
        - 'ei give {player} fg_shrink 1'
        - 'ei give {player} fg_grow 1'
        - 'minecraft:scoreboard players add {player} fg_repair 3'
        - 'sf give {player} REINFORCED_PLATE 4'
    30:
      message: '&6連簽 {days} 天！&7獲得 活躍點 40、變身藥水 ×2、補簽卡 2、黏液 POWER_CRYSTAL ×2、金蘋果 ×8'
      commands:
        - 'points give {player} 40 -s'
        - 'ei give {player} fg_morph_animal 1'
        - 'ei give {player} fg_morph_monster 1'
        - 'mp makeup {player} 2'
        - 'sf give {player} POWER_CRYSTAL 2'
        - 'minecraft:give {player} minecraft:enchanted_golden_apple 1'
    60:
      message: '&d&l連簽 {days} 天達成！&7獲得 活躍點 100、補簽卡 3、黏液 INFUSED_MAGNET、下界之星 ×2、修復次數 ×10、永久稱號 [連簽達人]'
      commands:
        - 'points give {player} 100 -s'
        - 'mp makeup {player} 3'
        - 'sf give {player} INFUSED_MAGNET 1'
        - 'minecraft:give {player} minecraft:nether_star 2'
        - 'minecraft:scoreboard players add {player} fg_repair 10'
        - 'lp user {player} permission set deluxetags.tag.mp_streak60 true'
        - 'broadcast &d{player} &e連續簽到 60 天！'

points-display-unit: '點'

cards:
  supply:
    display-name: '&6生存月卡'
    permission: 'monthpass.supply'

    on-activate:
      commands:
        - 'points give {player} 10 -s'

    on-expire:
      commands: []

    daily-reward:
      commands:
        - 'points give {player} 3 -s'
      items:
        - material: DIAMOND
          amount: 1
          name: '&b每日鑽石'
          lore:
            - '&7來自 &6生存月卡 &7的每日獎勵'
            - '&7日期：{date}'
        - material: EXPERIENCE_BOTTLE
          amount: 16
          name: '&a每日經驗瓶'
          lore:
            - '&7來自 &6生存月卡'
        - material: ENDER_PEARL
          amount: 2
          name: '&5每日終界珍珠'
          lore:
            - '&7來自 &6生存月卡'

    exp-boost:
      enable: true
      multiplier: 1.5

    expiry-warning:
      days: 3
      message: '&c你的 &6{card} &c還剩 &e{days} &c天到期！可到 &6/dshop &c續購'

    shop:
      enable: false

  premium:
    display-name: '&d豪華月卡'
    permission: 'monthpass.premium'

    on-activate:
      commands:
        - 'points give {player} 30 -s'

    on-expire:
      commands: []

    daily-reward:
      commands:
        - 'points give {player} 6 -s'
      items:
        - material: DIAMOND
          amount: 3
          name: '&b每日鑽石'
          lore:
            - '&7來自 &d豪華月卡 &7的每日獎勵'
            - '&7日期：{date}'
        - material: EXPERIENCE_BOTTLE
          amount: 32
          name: '&a每日經驗瓶'
          lore:
            - '&7來自 &d豪華月卡'
        - material: ENDER_PEARL
          amount: 4
          name: '&5每日終界珍珠'
          lore:
            - '&7來自 &d豪華月卡'
        - material: GOLDEN_CARROT
          amount: 32
          name: '&6每日金胡蘿蔔'
          lore:
            - '&7來自 &d豪華月卡'

    exp-boost:
      enable: true
      multiplier: 2.0

    expiry-warning:
      days: 5
      message: '&c你的 &d{card} &c還剩 &e{days} &c天到期！可到 &6/dshop &c續購'

    shop:
      enable: false
